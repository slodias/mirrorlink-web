<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MirrorLink Web - iPhone</title><style>
body{background:#101722;color:#fff;font:16px -apple-system,Arial,sans-serif;margin:0}main{max-width:500px;margin:auto;padding:24px}h1{font-size:28px}.panel{background:#1a293b;border-radius:16px;padding:18px;margin:20px 0}p,small{color:#bdcde0;line-height:1.5}input,button{box-sizing:border-box;width:100%;font-size:18px;padding:15px;border-radius:10px;margin:8px 0}input{background:#0c1623;color:white;border:1px solid #617895;text-align:center}button{background:#2788e8;color:white;border:0;font-weight:bold}button:disabled{opacity:.5}#stop{background:#425368}#status{white-space:pre-wrap}video{max-width:100%}
</style></head><body><main><h1>MirrorLink Web</h1><p>Samsung TV'de <b>tv.html</b> sayfasını aç ve kodu aşağıya yaz. Bu deneysel sürüm Miracast değildir.</p><div class="panel"><label>TV bağlantı kodu</label><input id="code" maxlength="6" inputmode="numeric" placeholder="6 haneli kod"><button id="start">Ekranı paylaş ve bağlan</button><button id="stop" disabled>Yayını durdur</button><video id="preview" autoplay muted playsinline style="display:none"></video></div><div class="panel"><h3>Uyumluluk</h3><p id="support"></p><p id="status">Hazır.</p></div><small>Prototip WebRTC ve üçüncü taraf PeerJS eşleştirme altyapısını kullanır. Ekran paylaşımı yalnızca tarayıcı izin veriyorsa başlar. Korunan içerikler aktarılmayabilir.</small></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
(function(){var $=function(s){return document.getElementById(s)},stream=null,peer=null,call=null;var canCapture=!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia);$('support').textContent='Ekran yakalama: '+(canCapture?'Var':'Yok')+' | WebRTC: '+(window.RTCPeerConnection?'Var':'Yok')+' | PeerJS: '+(window.Peer?'Var':'Yok');function status(s){$('status').textContent=s}function stop(){if(call){call.close();call=null}if(peer){peer.destroy();peer=null}if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$('preview').srcObject=null;$('preview').style.display='none';$('start').disabled=false;$('stop').disabled=true}$('stop').onclick=function(){stop();status('Yayın durduruldu.')};$('start').onclick=async function(){var code=$('code').value.trim();if(!/^\d{6}$/.test(code)){status('TV üzerindeki 6 haneli kodu gir.');return}if(!canCapture){status('Bu tarayıcı ekran yakalama API özelliğini sunmuyor.');return}if(!window.Peer){status('PeerJS yüklenemedi.');return}try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});$('preview').srcObject=stream;$('preview').style.display='block';$('start').disabled=true;$('stop').disabled=false;status('TV ile bağlantı kuruluyor...');stream.getVideoTracks()[0].addEventListener('ended',function(){stop();status('Paylaşım sona erdi.')});peer=new Peer();peer.on('open',function(){call=peer.call('mirrorlink-'+code,stream);if(!call){status('TV araması başlatılamadı.');return}call.on('stream',function(){status('TV bağlantısı kuruldu.')});call.on('error',function(e){status('Bağlantı hatası: '+e.message)});call.on('close',function(){stop();status('Bağlantı kapandı.')})});peer.on('error',function(e){status('Eşleştirme hatası: '+e.message)})}catch(e){stop();status('Yakalama başlatılamadı: '+e.message)}}})();
</script></body></html>
