<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MirrorLink Web - Samsung TV</title><style>body{background:#090f18;color:#fff;font-family:Arial,sans-serif;text-align:center;margin:0}#setup{padding:35px}h1{font-size:36px}#code{font-size:65px;letter-spacing:10px;color:#71c0ff;margin:30px}#status{font-size:22px;white-space:pre-wrap}#details{color:#bbcadb;margin-top:25px}#video{display:none;width:100%;height:100vh;object-fit:contain;background:#000}</style></head><body><div id="setup"><h1>MirrorLink Web - TV</h1><p>iPhone Safari'de sitenin ana sayfasını açın.</p><div id="code">------</div><div id="status">Kontrol ediliyor...</div><div id="details"></div></div><video id="video" autoplay playsinline></video><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
(function(){var $=function(s){return document.getElementById(s)};var rtc=!!(window.RTCPeerConnection||window.webkitRTCPConnection||window.mozRTCPeerConnection);var code=('000000'+Math.floor(Math.random()*1000000)).slice(-6);$('code').innerHTML=code;$('details').innerHTML='WebRTC: '+(rtc?'Var':'YOK')+' | HTML5 Video: '+($('video').canPlayType?'Var':'YOK')+' | PeerJS: '+(window.Peer?'Yüklendi':'YOK');if(!rtc){$('status').innerHTML='Bu TV tarayıcısı WebRTC desteklemiyor.\nBu yöntemle doğrudan canlı yayın alınamaz.';return}if(!window.Peer){$('status').innerHTML='PeerJS yüklenemedi. Eski tarayıcı veya bağlantı engeli olabilir.';return}try{var peer=new Peer('mirrorlink-'+code);peer.on('open',function(){$('status').innerHTML='Hazır. Kodu iPhone\'a girin.'});peer.on('call',function(call){$('status').innerHTML='iPhone bağlanıyor...';call.answer();call.on('stream',function(stream){var video=$('video');try{video.srcObject=stream}catch(e){try{video.src=window.URL.createObjectURL(stream)}catch(x){}}video.style.display='block';$('setup').style.display='none';var p=video.play();if(p&&p.catch){p.catch(function(){$('setup').style.display='block';$('status').innerHTML='Otomatik oynatma başarısız. Kumandadan oynatmayı deneyin.'})}});call.on('close',function(){$('video').style.display='none';$('setup').style.display='block';$('status').innerHTML='Yayın sonlandı.'})});peer.on('error',function(e){$('status').innerHTML='Hata: '+e.message})}catch(e){$('status').innerHTML='Tarayıcı hatası: '+e.message}})();
</script></body></html>
