name: MirrorLink
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  MirrorLink:
    type: application
    platform: iOS
    sources:
      - path: MirrorLink
    info:
      path: MirrorLink/Info.plist
      properties:
        CFBundleDisplayName: MirrorLink
        NSLocalNetworkUsageDescription: "Samsung TV'nin DLNA bağlantısını test etmek için yerel ağ erişimi gerekir."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sedkar.mirrorlink
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme: {}
