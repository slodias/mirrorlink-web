name: MirrorLink
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  MirrorLink:
    type: application
    platform: iOS
    sources:
      - path: MirrorLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sedkar.mirrorlink
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MirrorLink
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Samsung TV ile yerel ağda bağlantıyı test etmek için izin gerekir."
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
