name: Package MirrorLink for Swift Playground on iPad
on:
  push:
    branches: [main]
    paths:
      - 'playground/MirrorLink-iPad.swiftpm/**'
      - '.github/workflows/package-playground.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate package files and create downloadable zip
        shell: bash
        run: |
          set -euo pipefail
          test -f playground/MirrorLink-iPad.swiftpm/Package.swift
          test -f playground/MirrorLink-iPad.swiftpm/AppInfo.plist
          test -f playground/MirrorLink-iPad.swiftpm/AppModule/MirrorLinkApp.swift
          test -f playground/MirrorLink-iPad.swiftpm/AppModule/ContentView.swift
          test -f playground/MirrorLink-iPad.swiftpm/AppModule/DLNAProbe.swift
          mkdir -p dist
          (cd playground && zip -qr ../dist/MirrorLink-iPad.zip MirrorLink-iPad.swiftpm)
          unzip -l dist/MirrorLink-iPad.zip
      - name: Save downloadable archive in public repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/MirrorLink-iPad.zip
          git diff --cached --quiet && exit 0
          git commit -m "Package MirrorLink for Swift Playground"
          git pull --rebase origin main
          git push origin HEAD:main
